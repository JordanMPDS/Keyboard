name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  # Fossify Commons is built from the commons submodule
                  submodules: true
            - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
              with:
                  java-version: 17
                  distribution: "temurin"
            - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
            - name: Run tests, detekt and lint
              run: ./gradlew :app:testFossDebugUnitTest detekt lint
